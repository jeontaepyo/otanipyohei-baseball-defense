  <!-- 움직이는 전술도 추가 스타일 -->
  <style>

    .anim-toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin: 5px 0 13px;
    }

    .anim-toolbar button {
      flex: 0 0 auto;
    }

    .anim-toolbar button:disabled {
      opacity: .65;
      cursor: default;
    }

    .anim-progress {
      margin-left: auto;
      font-size: 10px;
      font-weight: 900;
      color: #68736f;
      letter-spacing: .04em;
      background: #f1f4f1;
      border-radius: 999px;
      padding: 6px 9px;
    }

    .anim-stage-wrap {
      position: relative;
    }

    .anim-stage[hidden] {
      display: none !important;
    }

    .animated-field {
      overflow: visible;
    }

    .anim-path {
      transition: opacity .18s ease;
    }

    .anim-token {
      will-change: transform;
    }

    .anim-caption {

<body>

  <!-- 기존 사이트 본체 -->
  <script src="app.js"></script>


  <!--
    =========================================
    움직이는 전술도 + 뒤로가기 시스템
    =========================================
  -->
  <script>

    (() => {

      const reduceMotion =
        window.matchMedia?.(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      let runSerial = 0;


      /*
       * =========================================
       * SVG 움직이는 객체 생성
       * =========================================
       */

      function svgToken(
        label,
        start,
        kind,
        extra = ''
      ) {

        const [x, y] = start;


        const config = {

          move: {
            fill: '#0d3328',
            stroke: '#0d3328',
            text: '#ffffff',
            radius: 3.9
          },

          runner: {
            fill: '#d87b2b',
            stroke: '#a85917',
            text: '#ffffff',
            radius: 3.5
          },

          ball: {
            fill: '#c84a3d',
            stroke: '#9f2f25',
            text: '#ffffff',
            radius: 1.9
          },

          throw: {
            fill: '#ffffff',
            stroke: '#39895c',
            text: '#39895c',
            radius: 1.9
          }

        }[kind];


        const text =
          kind === 'ball' ||
          kind === 'throw'

            ? ''

            : `
              <text
                x="0"
                y="1.05"
                font-size="2.55"
                text-anchor="middle"
                font-weight="900"
                fill="${config.text}"
              >
                ${esc(label)}
              </text>
            `;


        return `
          <g
            class="anim-token anim-${kind}"
            data-anim-token="${kind}"
            data-x1="${x}"
            data-y1="${y}"
            ${extra}
            transform="translate(${x} ${y})"
            opacity="${kind === 'throw' ? 0 : 1}"
          >

            <circle
              cx="0"
              cy="0"
              r="${config.radius}"
              fill="${config.fill}"
              stroke="${config.stroke}"
              stroke-width=".85"
            />

            ${text}

          </g>
        `;

      }



      /*
       * =========================================
       * 이동 경로
       * =========================================
       */

      function svgPath(
        start,
        end,
        kind,
        extra = ''
      ) {

        const config = {

          ball: [
            '#c84a3d',
            'arrR',
            ''
          ],

          move: [
            '#3d6eb4',
            'arrB',
            '4 2'
          ],

          runner: [
            '#d87b2b',
            'arrO',
            '3 2'
          ],

          throw: [
            '#39895c',
            'arrG',
            ''
          ]

        }[kind];


        const dash =
          config[2]

            ? `stroke-dasharray="${config[2]}"`

            : '';


        return `
          <line
            class="anim-path anim-path-${kind}"
            data-anim-path="${kind}"
            ${extra}

            x1="${start[0]}"
            y1="${start[1]}"

            x2="${end[0]}"
            y2="${end[1]}"

            stroke="${config[0]}"
            stroke-width="1.7"
            stroke-linecap="round"

            ${dash}

            marker-end="url(#${config[1]})"

            opacity=".18"
          />
        `;

      }



      /*
       * =========================================
       * 전술도 한 단계 SVG
       * =========================================
       */

      function animatedStageSVG(
        stage,
        stageIndex
      ) {

        let svg = `
          <svg
            class="field-svg animated-field"
            viewBox="0 0 100 100"
            data-stage-svg="${stageIndex}"
          >

            ${markerDefs()}
            ${fieldBase()}
        `;


        const active =
          stage.active || [];


        const movingNames =
          new Set(

            (stage.moves || [])
              .map(move => move[0])

          );


        /*
         * 움직이지 않는 기본 야수
         */

        Object
          .entries(POS)
          .forEach(([name, position]) => {

            if (
              !movingNames.has(name)
            ) {

              svg += player(
                name,
                position,
                active.includes(name)
              );

            }

          });



        /*
         * 타구 경로
         */

        if (stage.ball) {

          const [
            start,
            end
          ] = stage.ball;

          svg += svgPath(
            start,
            end,
            'ball'
          );

        }



        /*
         * 야수 이동 경로
         */

        (stage.moves || [])
          .forEach(
            ([name, start, end], index) => {

              svg += svgPath(

                start,
                end,
                'move',

                `data-link-index="${index}"`

              );

            }
          );



        /*
         * 주자 이동 경로
         */

        (stage.runner || [])
          .forEach(
            ([name, start, end], index) => {

              svg += svgPath(

                start,
                end,
                'runner',

                `data-link-index="${index}"`

              );

            }
          );



        /*
         * 송구 경로
         */

        (stage.throws || [])
          .forEach(
            ([start, end], index) => {

              svg += svgPath(

                start,
                end,
                'throw',

                `data-link-index="${index}"`

              );

            }
          );



        /*
         * 움직이는 야수
         */

        (stage.moves || [])
          .forEach(
            ([name, start, end], index) => {

              svg += svgToken(

                name,
                start,
                'move',

                `
                  data-x2="${end[0]}"
                  data-y2="${end[1]}"
                  data-link-index="${index}"
                `

              );

            }
          );



        /*
         * 움직이는 주자
         */

        (stage.runner || [])
          .forEach(
            ([name, start, end], index) => {

              svg += svgToken(

                name,
                start,
                'runner',

                `
                  data-x2="${end[0]}"
                  data-y2="${end[1]}"
                  data-link-index="${index}"
                `

              );

            }
          );



        /*
         * 타구 공
         */

        if (stage.ball) {

          const [
            start,
            end
          ] = stage.ball;


          svg += svgToken(

            '',
            start,
            'ball',

            `
              data-x2="${end[0]}"
              data-y2="${end[1]}"
            `

          );

        }



        /*
         * 송구 공
         */

        (stage.throws || [])
          .forEach(
            ([start, end], index) => {

              svg += svgToken(

                '',
                start,
                'throw',

                `
                  data-x2="${end[0]}"
                  data-y2="${end[1]}"
                  data-link-index="${index}"
                `

              );

            }
          );


        svg += '</svg>';


        return svg;

      }



      /*
       * =========================================
       * 기존 전술도를 애니메이션 전술도로 교체
       * =========================================
       */

      diagramHTML = function(id) {

        const diagram =
          DIAGRAMS[id];


        if (!diagram) {

          return '';

        }


        const totalSteps =
          diagram.stages.length;


        return `

          <div
            class="diagram-card animated-diagram"
            data-anim-diagram="${esc(id)}"
          >

            <div class="diagram-head">

              <b>
                ${esc(diagram.title)}
              </b>

              <span>
                움직이는 전술도
              </span>

            </div>


            <div class="anim-toolbar">

              <button
                type="button"
                class="action-btn primary"
                data-anim-action="play"
              >
                ▶ 전체 재생
              </button>


              <button
                type="button"
                class="action-btn"
                data-anim-action="replay"
              >
                ↻ 다시보기
              </button>


              <span class="anim-progress">

                STEP 1 / ${totalSteps}

              </span>

            </div>


            <div class="anim-stage-wrap">

              ${diagram.stages
                .map(

                  (stage, index) => `

                    <div
                      class="
                        diagram-stage
                        anim-stage
                        ${index === 0 ? 'is-current' : ''}
                      "

                      data-anim-stage="${index}"

                      ${index === 0 ? '' : 'hidden'}
                    >

                      <div class="diagram-stage-title">

                        ${
                          esc(
                            stage.title ||
                            `STEP ${index + 1}`
                          )
                        }

                      </div>


                      ${animatedStageSVG(
                        stage,
                        index
                      )}


                      <div class="anim-caption">

                        ${
                          stage.note

                          ? `※ ${esc(stage.note)}`

                          : '▶ 재생을 누르면 공·주자·야수의 움직임을 순서대로 볼 수 있습니다.'
                        }

                      </div>

                    </div>

                  `

                )
                .join('')}

            </div>


            <div class="legend">

              <span>
                <i class="ball"></i>
                타구
              </span>

              <span>
                <i class="move"></i>
                야수 이동
              </span>

              <span>
                <i class="throw"></i>
                송구
              </span>

              <span>
                <i class="runner"></i>
                주자
              </span>

            </div>

          </div>

        `;

      };



      /*
       * =========================================
       * 애니메이션 엔진
       * =========================================
       */

      function setTokenPosition(
        element,
        x,
        y
      ) {

        element.setAttribute(

          'transform',

          `translate(${x} ${y})`

        );

      }



      function resetStage(
        stageElement
      ) {

        stageElement
          .querySelectorAll(
            '[data-anim-token]'
          )
          .forEach(element => {

            setTokenPosition(

              element,

              Number(
                element.dataset.x1
              ),

              Number(
                element.dataset.y1
              )

            );


            element.style.opacity =

              element.dataset.animToken ===
              'throw'

              ? '0'

              : '1';

          });



        stageElement
          .querySelectorAll(
            '[data-anim-path]'
          )
          .forEach(element => {

            element.style.opacity =
              '.18';

          });

      }



      function easeInOut(t) {

        return t < .5

          ? 2 * t * t

          : 1 -
            Math.pow(
              -2 * t + 2,
              2
            ) / 2;

      }



      function tweenToken(
        element,
        duration,
        card,
        runId
      ) {

        const x1 =
          Number(
            element.dataset.x1
          );

        const y1 =
          Number(
            element.dataset.y1
          );

        const x2 =
          Number(
            element.dataset.x2
          );

        const y2 =
          Number(
            element.dataset.y2
          );


        if (reduceMotion) {

          setTokenPosition(
            element,
            x2,
            y2
          );

          return Promise.resolve();

        }


        return new Promise(resolve => {

          const start =
            performance.now();


          function tick(now) {

            if (
              !card.isConnected ||
              card.dataset.animRun !==
              String(runId)
            ) {

              resolve();

              return;

            }


            const progress =
              Math.min(

                1,

                (now - start) /
                duration

              );


            const eased =
              easeInOut(progress);


            const x =
              x1 +
              (x2 - x1) *
              eased;


            const y =
              y1 +
              (y2 - y1) *
              eased;


            setTokenPosition(
              element,
              x,
              y
            );


            if (
              progress < 1
            ) {

              requestAnimationFrame(
                tick
              );

            }

            else {

              resolve();

            }

          }


          requestAnimationFrame(
            tick
          );

        });

      }



      function wait(
        milliseconds,
        card,
        runId
      ) {

        if (reduceMotion) {

          return Promise.resolve();

        }


        return new Promise(resolve => {

          const start =
            performance.now();


          function check(now) {

            if (
              !card.isConnected ||
              card.dataset.animRun !==
              String(runId)
            ) {

              resolve();

              return;

            }


            if (
              now - start >=
              milliseconds
            ) {

              resolve();

              return;

            }


            requestAnimationFrame(
              check
            );

          }


          requestAnimationFrame(
            check
          );

        });

      }



      /*
       * =========================================
       * STEP 하나 재생
       * =========================================
       */

      async function playStage(
        stageElement,
        card,
        runId
      ) {

        resetStage(
          stageElement
        );


        const ball =
          stageElement.querySelector(
            '[data-anim-token="ball"]'
          );


        const movers = [
          ...stageElement.querySelectorAll(
            '[data-anim-token="move"]'
          )
        ];


        const runners = [
          ...stageElement.querySelectorAll(
            '[data-anim-token="runner"]'
          )
        ];


        const throws = [
          ...stageElement.querySelectorAll(
            '[data-anim-token="throw"]'
          )
        ];


        const firstPhase = [];


        /*
         * 타구
         */

        if (ball) {

          const path =
            stageElement.querySelector(
              '[data-anim-path="ball"]'
            );


          if (path) {

            path.style.opacity =
              '.90';

          }


          firstPhase.push(

            tweenToken(
              ball,
              900,
              card,
              runId
            )

          );

        }



        /*
         * 야수 이동
         */

        movers.forEach(
          (element, index) => {

            const path =
              stageElement.querySelector(

                `[data-anim-path="move"][data-link-index="${element.dataset.linkIndex}"]`

              );


            if (path) {

              path.style.opacity =
                '.78';

            }


            firstPhase.push(

              wait(
                140 + index * 40,
                card,
                runId
              )

              .then(() =>

                tweenToken(
                  element,
                  1250,
                  card,
                  runId
                )

              )

            );

          }
        );



        /*
         * 주자 이동
         */

        runners.forEach(
          (element, index) => {

            const path =
              stageElement.querySelector(

                `[data-anim-path="runner"][data-link-index="${element.dataset.linkIndex}"]`

              );


            if (path) {

              path.style.opacity =
                '.80';

            }


            firstPhase.push(

              wait(
                90 + index * 35,
                card,
                runId
              )

              .then(() =>

                tweenToken(
                  element,
                  1350,
                  card,
                  runId
                )

              )

            );

          }
        );


        await Promise.all(
          firstPhase
        );


        if (
          card.dataset.animRun !==
          String(runId)
        ) {

          return;

        }


        await wait(
          180,
          card,
          runId
        );



        /*
         * 송구는 순서대로
         */

        for (
          const element of throws
        ) {

          if (
            card.dataset.animRun !==
            String(runId)
          ) {

            return;

          }


          const path =
            stageElement.querySelector(

              `[data-anim-path="throw"][data-link-index="${element.dataset.linkIndex}"]`

            );


          if (path) {

            path.style.opacity =
              '.95';

          }


          element.style.opacity =
            '1';


          await tweenToken(

            element,
            720,
            card,
            runId

          );


          await wait(

            90,
            card,
            runId

          );

        }

      }



      /*
       * =========================================
       * 현재 STEP 표시
       * =========================================
       */

      function showStage(
        card,
        index
      ) {

        const stages = [

          ...card.querySelectorAll(
            '.anim-stage'
          )

        ];


        stages.forEach(
          (element, stageIndex) => {

            element.hidden =
              stageIndex !== index;


            element.classList.toggle(

              'is-current',

              stageIndex === index

            );


            if (
              stageIndex === index
            ) {

              resetStage(
                element
              );

            }

          }
        );


        const progress =
          card.querySelector(
            '.anim-progress'
          );


        if (progress) {

          progress.textContent =
            `STEP ${index + 1} / ${stages.length}`;

        }

      }



      /*
       * =========================================
       * 전체 전술 재생
       * =========================================
       */

      async function playDiagram(
        card
      ) {

        const runId =
          ++runSerial;


        card.dataset.animRun =
          String(runId);


        const stages = [

          ...card.querySelectorAll(
            '.anim-stage'
          )

        ];


        const playButton =
          card.querySelector(
            '[data-anim-action="play"]'
          );


        if (playButton) {

          playButton.disabled =
            true;

          playButton.textContent =
            '재생 중…';

        }


        for (
          let index = 0;
          index < stages.length;
          index++
        ) {

          if (
            card.dataset.animRun !==
            String(runId)
          ) {

            break;

          }


          showStage(
            card,
            index
          );


          await playStage(

            stages[index],
            card,
            runId

          );


          if (
            index <
            stages.length - 1
          ) {

            await wait(

              650,
              card,
              runId

            );

          }

        }


        if (
          card.dataset.animRun ===
          String(runId) &&
          playButton
        ) {

          playButton.disabled =
            false;

          playButton.textContent =
            '▶ 전체 재생';

        }

      }



      /*
       * =========================================
       * 전술도 버튼 클릭
       * =========================================
       */

      view.addEventListener(
        'click',
        event => {

          const button =
            event.target.closest(
              '[data-anim-action]'
            );


          if (!button) {

            return;

          }


          const card =
            button.closest(
              '.animated-diagram'
            );


          if (!card) {

            return;

          }


          event.preventDefault();


          if (
            button.dataset.animAction ===
            'play' ||

            button.dataset.animAction ===
            'replay'
          ) {

            /*
             * 이전 재생 취소
             */

            card.dataset.animRun =
              String(
                ++runSerial
              );


            showStage(
              card,
              0
            );


            playDiagram(
              card
            );

          }

        }
      );



      /*
       * app.js가 처음 그려놓은
       * 정적 전술도를
       * 움직이는 전술도로 다시 렌더링
       */

      render();



      /*
       * =========================================
       * 상단 뒤로가기
       * =========================================
       */

      const topNavButton =
        document.getElementById(
          'homeBtn'
        );


      function syncTopNavButton() {

        const isHome =
          state.route ===
          'home';


        topNavButton.textContent =

          isHome
          ? '⌂'
          : '←';


        topNavButton.setAttribute(

          'aria-label',

          isHome
          ? '홈'
          : '뒤로가기'

        );

      }



      /*
       * 처음 화면을
       * 히스토리 기준점으로 저장
       */

      history.replaceState(

        {
          baseballDefenseState: {

            route:
              state.route,

            params:
              state.params

          }
        },

        '',

        location.href

      );



      /*
       * 기존 화면 이동 기능을
       * 브라우저 히스토리와 연결
       */

      routeTo = function(
        route,
        params = {}
      ) {

        const sameRoute =

          state.route ===
          route

          &&

          JSON.stringify(
            state.params || {}
          )

          ===

          JSON.stringify(
            params || {}
          );


        if (sameRoute) {

          window.scrollTo({

            top: 0,
            behavior: 'instant'

          });

          return;

        }


        state = {
          route,
          params
        };


        history.pushState(

          {
            baseballDefenseState: {
              route,
              params
            }
          },

          '',

          location.href

        );


        render();

        syncTopNavButton();


        window.scrollTo({

          top: 0,
          behavior: 'instant'

        });

      };



      /*
       * 브라우저 자체
       * 뒤로가기 / 앞으로가기
       */

      window.addEventListener(
        'popstate',
        event => {

          const saved =
            event.state
              ?.baseballDefenseState;


          state = saved

            ? {

                route:
                  saved.route ||
                  'home',

                params:
                  saved.params ||
                  {}

              }

            : {

                route: 'home',
                params: {}

              };


          render();

          syncTopNavButton();


          window.scrollTo({

            top: 0,
            behavior: 'instant'

          });

        }
      );



      /*
       * 상단 왼쪽 버튼
       */

      topNavButton.addEventListener(

        'click',

        event => {

          event.preventDefault();

          event.stopImmediatePropagation();


          if (
            state.route ===
            'home'
          ) {

            window.scrollTo({

              top: 0,
              behavior: 'smooth'

            });

          }

          else {

            history.back();

          }

        },

        true

      );


      syncTopNavButton();

    })();

  </script>

      background: #0d3328;

      color: #ffffff;

      padding: 9px 15px;

      border-radius: 999px;

      font-size: 13px;

      font-weight: 800;

        rgba(0,0,0,.22);

      white-space: nowrap;

    "

  >

    ⚾ 방문자 수 불러오는 중…

  </div>



  <script>

    fetch(
      'https://teph.goatcounter.com/counter/TOTAL.json'
    )

      .then(
        response => {

          if (
            !response.ok
          ) {

            throw new Error(
              'GoatCounter response error'
            );

          }

          return response.json();

        }
      )

      .then(
        data => {

          const counter =
            document.getElementById(
              'visitorCounter'
            );


          if (
            data &&
            data.count !==
            undefined
          ) {

            counter.textContent =

              `⚾ 누적 방문 ${data.count}명`;

          }

          else {

            counter.textContent =
              '⚾ 방문자 집계 중';

          }

        }
      )

      .catch(
        error => {

          console.error(
            'Visitor counter error:',
            error
          );


          document
            .getElementById(
              'visitorCounter'
            )
            .textContent =

              '⚾ 방문자 집계 중';

        }
      );

  </script>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="description" content="사회인야구 수비를 포지션·주자·아웃카운트별로 바로 찾는 모바일 수비 매뉴얼" />
  <meta property="og:title" content="사회인야구 수비의 디테일" />
  <meta property="og:description" content="포지션·주자·아웃카운트만 선택하면 지금 해야 할 수비를 바로 찾습니다." />
  <meta property="og:type" content="website" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>사회인야구 수비의 디테일</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="홈">⌂</button>
      <div class="brand-wrap">
        <div class="brand">사회인야구 수비의 디테일</div>
        <div class="crumb" id="crumb">HOME</div>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="검색">⌕</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button data-route="home">⌂<span>홈</span></button>
      <button data-route="positions">⚾<span>포지션</span></button>
      <button data-route="situations">◇<span>상황</span></button>
      <button data-route="favorites">☆<span>저장</span></button>
    </nav>
  </div>

  <dialog id="searchDialog" class="search-dialog">
    <form method="dialog" class="search-head">
      <input id="searchInput" type="search" placeholder="예: 2루 도루, 만루 2아웃, CONTACT" autocomplete="off" />
      <button value="cancel">닫기</button>
    </form>
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>

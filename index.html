<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3328" />

  <meta
    name="description"
    content="오태니표헤이의 사회인야구 수비의 디테일 — 포지션·주자·아웃카운트·플레이별 실전 수비 모바일 매뉴얼"
  />

  <meta
    property="og:title"
    content="오태니표헤이의 사회인야구 수비의 디테일"
  />

  <meta
    property="og:description"
    content="경험하기 전에 배우는 실전 팀 디펜스. 경기장에서 10초 안에 수비 답을 찾으세요."
  />

  <meta property="og:type" content="website" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta
    name="apple-mobile-web-app-title"
    content="오태니표헤이 수비"
  />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />

  <title>오태니표헤이의 사회인야구 수비의 디테일</title>
</head>

<body>

  <div id="app" class="app-shell">

    <header class="topbar">

      <button
        class="icon-btn"
        id="homeBtn"
        aria-label="홈"
      >
        ⌂
      </button>

      <div class="brand-wrap">
        <div class="brand-mini">오태니표헤이의</div>

        <div class="brand">
          사회인야구 수비의 디테일
        </div>

        <div
          class="crumb"
          id="crumb"
        >
          HOME
        </div>
      </div>

      <button
        class="icon-btn"
        id="searchBtn"
        aria-label="검색"
      >
        ⌕
      </button>

    </header>


    <main
      id="view"
      class="view"
    ></main>


    <nav
      class="bottom-nav"
      aria-label="하단 메뉴"
    >

      <button data-route="home">
        ⌂
        <span>홈</span>
      </button>

      <button data-route="positions">
        ⚾
        <span>포지션</span>
      </button>

      <button data-route="situations">
        ◇
        <span>상황</span>
      </button>

      <button data-route="plays">
        ▶
        <span>플레이</span>
      </button>

      <button data-route="favorites">
        ☆
        <span>저장</span>
      </button>

    </nav>

  </div>


  <dialog
    id="searchDialog"
    class="search-dialog"
  >

    <form
      method="dialog"
      class="search-head"
    >

      <input
        id="searchInput"
        type="search"
        placeholder="예: 2루 도루, R2 번트, CONTACT, 인필드플라이"
        autocomplete="off"
      />

      <button value="cancel">
        닫기
      </button>

    </form>

    <div
      id="searchResults"
      class="search-results"
    ></div>

  </dialog>


  <!-- 메인 앱 -->
  <script src="app.js"></script>


  <!-- 뒤로가기 / 브라우저 히스토리 기능 -->
  <script>
    (() => {

      const topNavButton =
        document.getElementById('homeBtn');


      function syncTopNavButton() {

        const isHome =
          state.route === 'home';

        if (isHome) {

          topNavButton.textContent = '⌂';

          topNavButton.setAttribute(
            'aria-label',
            '홈'
          );

        } else {

          topNavButton.textContent = '←';

          topNavButton.setAttribute(
            'aria-label',
            '뒤로가기'
          );

        }

      }


      /*
       * 최초 홈 화면을
       * 브라우저 히스토리 기준점으로 저장
       */
      history.replaceState(
        {
          baseballDefenseState: {
            route: state.route,
            params: state.params
          }
        },
        '',
        location.href
      );


      /*
       * 기존 routeTo를
       * 브라우저 히스토리를 사용하는 방식으로 변경
       */
      routeTo = function(route, params = {}) {

        const sameRoute =
          state.route === route &&
          JSON.stringify(state.params || {}) ===
          JSON.stringify(params || {});


        if (sameRoute) {

          window.scrollTo({
            top: 0,
            behavior: 'instant'
          });

          return;

        }


        state = {
          route,
          params
        };


        history.pushState(
          {
            baseballDefenseState: {
              route,
              params
            }
          },
          '',
          location.href
        );


        render();

        syncTopNavButton();


        window.scrollTo({
          top: 0,
          behavior: 'instant'
        });

      };


      /*
       * 브라우저 뒤로가기 / 앞으로가기
       */
      window.addEventListener(
        'popstate',
        event => {

          const savedState =
            event.state?.baseballDefenseState;


          if (savedState) {

            state = {
              route: savedState.route || 'home',
              params: savedState.params || {}
            };

          } else {

            state = {
              route: 'home',
              params: {}
            };

          }


          render();

          syncTopNavButton();


          window.scrollTo({
            top: 0,
            behavior: 'instant'
          });

        }
      );


      /*
       * 상단 왼쪽 버튼
       *
       * 홈에서는 홈 아이콘
       * 세부 페이지에서는 뒤로가기
       */
      topNavButton.addEventListener(
        'click',
        event => {

          event.preventDefault();

          /*
           * app.js에 들어있는 기존 홈 버튼
           * 이벤트보다 먼저 처리
           */
          event.stopImmediatePropagation();


          if (state.route === 'home') {

            window.scrollTo({
              top: 0,
              behavior: 'smooth'
            });

            return;

          }


          history.back();

        },
        true
      );


      syncTopNavButton();

    })();
  </script>


  <!-- GoatCounter 방문 통계 -->
  <script
    data-goatcounter="https://teph.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js">
  </script>


  <!-- 방문자 수 표시 -->
  <div
    id="visitorCounter"
    style="
      position: fixed;
      right: 16px;
      bottom: 82px;
      z-index: 9999;

      background: #0d3328;
      color: #ffffff;

      padding: 9px 15px;
      border-radius: 999px;

      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;

      box-shadow: 0 5px 18px rgba(0,0,0,.22);

      white-space: nowrap;
    "
  >
    ⚾ 방문자 수 불러오는 중…
  </div>


  <script>

    fetch(
      'https://teph.goatcounter.com/counter/TOTAL.json'
    )

      .then(response => {

        if (!response.ok) {

          throw new Error(
            'GoatCounter response error'
          );

        }

        return response.json();

      })

      .then(data => {

        const counter =
          document.getElementById(
            'visitorCounter'
          );


        if (
          data &&
          data.count !== undefined
        ) {

          counter.textContent =
            `⚾ 누적 방문 ${data.count}명`;

        } else {

          counter.textContent =
            '⚾ 방문자 집계 중';

        }

      })

      .catch(error => {

        console.error(
          'Visitor counter error:',
          error
        );


        document
          .getElementById(
            'visitorCounter'
          )
          .textContent =
          '⚾ 방문자 집계 중';

      });

  </script>

</body>
</html>

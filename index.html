<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3328" />
  <meta name="description" content="오태니표헤이의 사회인야구 수비의 디테일 — 주자·아웃·타구 방향에 따른 9명의 수비 움직임을 애니메이션으로 배우는 실전 수비 매뉴얼" />
  <meta property="og:title" content="오태니표헤이의 사회인야구 수비의 디테일" />
  <meta property="og:description" content="주자와 타구 상황을 고르면 9명의 수비 움직임을 애니메이션으로 확인합니다." />
  <meta property="og:type" content="website" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="오태니표헤이 수비" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="simulator.css" />
  <link rel="stylesheet" href="v4.css" />
  <title>오태니표헤이의 사회인야구 수비의 디테일</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" aria-label="홈">⌂</button>
      <div class="brand-wrap">
        <div class="brand-mini">오태니표헤이의</div>
        <div class="brand">사회인야구 수비의 디테일</div>
        <div class="crumb" id="crumb">HOME</div>
      </div>
      <button class="icon-btn" id="searchBtn" aria-label="검색">⌕</button>
    </header>
    <main id="view" class="view"></main>
    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button data-route="home">⌂<span>홈</span></button>
      <button data-route="positions">⚾<span>포지션</span></button>
      <button data-route="situations">◇<span>상황</span></button>
      <button data-route="plays">▶<span>플레이</span></button>
      <button data-route="favorites">☆<span>저장</span></button>
    </nav>
  </div>
  <dialog id="searchDialog" class="search-dialog">
    <form method="dialog" class="search-head">
      <input id="searchInput" type="search" placeholder="예: R1 유격수 땅볼, R2 좌전안타, 번트, 컷오프" autocomplete="off" />
      <button value="cancel">닫기</button>
    </form>
    <div id="searchResults" class="search-results"></div>
  </dialog>
  <script src="app.js"></script>
  <script src="simulator.js"></script>
  <script src="v4.js"></script>
  <script data-goatcounter="https://teph.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  <div id="visitorCounter" style="position:fixed;right:12px;bottom:88px;z-index:9999;background:rgba(13,51,40,.92);color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.16);white-space:nowrap;pointer-events:none">⚾ 방문 집계 중…</div>
  <script>
    fetch('https://teph.goatcounter.com/counter/TOTAL.json').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{if(data&&data.count!==undefined)document.getElementById('visitorCounter').textContent=`⚾ 누적 방문 ${data.count}`}).catch(()=>{document.getElementById('visitorCounter').textContent='⚾ 방문 집계 중'});
  </script>
</body>
</html>
